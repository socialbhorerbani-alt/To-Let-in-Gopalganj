    function listenToListings() {
      if (isFirebaseReady && firebaseDb) {
        firebaseDb.collection("listings").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
          listings = [];
          snapshot.forEach((doc) => {
            listings.push({ id: doc.id, ...doc.data() });
          });
          applyFilters();
        }, (error) => {
          console.warn("Firestore realtime fetch failed, loading local:", error);
          listings = JSON.parse(localStorage.getItem('gopalganj_tolet')) || [];
          applyFilters();
        });
      } else {
        listings = JSON.parse(localStorage.getItem('gopalganj_tolet')) || [];
        applyFilters();
      }
    }

    // ==========================================

    async function uploadToImgBB(file) {
      const apiKey = "4ac5668ba66709b8e8c1c641a57dcca9";
      const formData = new FormData();
      formData.append("image", file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error(data.error ? data.error.message : "ছবি আপলোড ব্যর্থ হয়েছে");
      }
    }

    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    const MAX_VIDEO_SIZE_BYTES = 50 * 1024 * 1024; // ফ্রি সাইটের জন্য 50MB এর বেশি ব্রাউজার আটকে দিতে পারে

    function validateVideoFileSize(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        if (file.size > MAX_VIDEO_SIZE_BYTES) {
          alert(`ভিডিও সাইজ ৫০ MB এর বেশি হতে পারবে না। অনুগ্রহ করে ভিডিও লিঙ্ক (YouTube/Drive) ব্যবহার করুন।`);
          input.value = '';
          return false;
        }
      }
      return true;
    }

    // ==========================================
    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> ছবি আপলোড ও সেভ হচ্ছে...`;

      const editId = document.getElementById('editListingId').value;
      let existingListing = editId ? listings.find(l => l.id == editId) : null;

      // Handle Multiple Images via ImgBB
      let uploadedImages = existingListing ? [...(existingListing.images || [])] : [];
      const imgInput = document.getElementById('formImageFiles');

      if (imgInput.files && imgInput.files.length > 0) {
        uploadedImages = []; // নতুন ছবি সিলেক্ট করলে আগেরটি রিপ্লেস করবে
        for (let i = 0; i < imgInput.files.length; i++) {
          try {
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> ছবি ${i+1}/${imgInput.files.length} আপলোড হচ্ছে...`;
            const uploadedUrl = await uploadToImgBB(imgInput.files[i]);
            uploadedImages.push(uploadedUrl);
          } catch (err) {
            console.error("ImgBB Upload Failed:", err);
            alert(`ছবি (${imgInput.files[i].name}) আপলোড ব্যর্থ হয়েছে! ইন্টারনেট বা API চেক করুন।`);
          }
        }
      }

      if (uploadedImages.length === 0) {
        uploadedImages = ["https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=600&auto=format&fit=crop&q=80"];
      }

      // Handle Video
      let videoUrl = document.getElementById('formVideoUrl').value.trim();
      const vidInput = document.getElementById('formVideoFile');
      if (vidInput.files && vidInput.files[0]) {
        try {
          videoUrl = await fileToBase64(vidInput.files[0]);
        } catch(vErr) {
          console.warn("Video read error:", vErr);
        }
      } else if (!videoUrl && existingListing) {
        videoUrl = existingListing.video || "";
      }

      const listingData = {
        title: document.getElementById('formTitle').value.trim(),
        type: document.getElementById('formType').value,
        area: document.getElementById('formArea').value,
        rent: Number(document.getElementById('formRent').value),
        available: document.getElementById('formAvailable').value.trim(),
        phone: document.getElementById('formPhone').value.trim(),
        specs: document.getElementById('formSpecs').value.trim(),
        desc: document.getElementById('formDesc').value.trim(),
        images: uploadedImages,
        video: videoUrl,
        postedBy: currentUser.name,
        ownerPhone: currentUser.phone,
        createdAt: existingListing ? (existingListing.createdAt || Date.now()) : Date.now()
      };

      const docId = editId ? String(editId) : String(Date.now());

      // Save to Firebase Firestore
      if (isFirebaseReady && firebaseDb) {
        try {
          await firebaseDb.collection("listings").doc(docId).set(listingData);
          console.log("Firestore-এ সফলভাবে সেভ হয়েছে!");
        } catch (fErr) {
          console.error("Firestore save error:", fErr);
          alert("ডাটাবেজে সেভ হতে সমস্যা হয়েছে। Firebase Rules চেক করুন।");
        }
      }

      // Local storage backup
      if (editId) {
        const idx = listings.findIndex(l => l.id == editId);
        if (idx !== -1) listings[idx] = { id: docId, ...listingData };
      } else {
        listings.unshift({ id: docId, ...listingData });
      }
      try {
        localStorage.setItem('gopalganj_tolet', JSON.stringify(listings));
      } catch(e) {}

      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-sm"></i> <span>বিজ্ঞাপন সংরক্ষণ করুন</span>`;
      e.target.reset();
      toggleAdModal(false);
      applyFilters();

      if (!document.getElementById('userDashboardModal').classList.contains('hidden')) {
        openUserDashboard();
      }
      if (!document.getElementById('adminPanelModal').classList.contains('hidden')) {
        renderAdminAdsList();
      }
      alert("বিজ্ঞাপন সফলভাবে প্রকাশিত হয়েছে!");
    }

    function handleImagePreview(input) {
      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = '';
      if (!input.files || input.files.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      Array.from(input.files).forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = e => {
          const thumb = document.createElement('div');
          thumb.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 shadow-sm";
          thumb.innerHTML = `
            <img src="${e.target.result}" class="w-full h-full object-cover">
            <span class="absolute bottom-0 right-0 bg-black/60 text-white text-[9px] px-1 font-bold">#${index+1}</span>
          `;
          container.appendChild(thumb);
        };
        reader.readAsDataURL(file);
      });
    }

    function sendOtpViaEmail() {
      const email = document.getElementById('fpEmail').value.trim().toLowerCase();
      const user = users.find(u => u.email === email);

      if (!user) {
        alert("এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি!");
        return;
      }

      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
      otpTargetEmail = email;

      const btn = document.getElementById('btnSendOtp');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> পাঠানো হচ্ছে...`;

      const templateParams = {
        to_email: email,
        to_name: user.name,
        otp_code: generatedOtp,
        message: `আপনার টু-লেট গোপালগঞ্জ অ্যাকাউন্টের ওটিপি হলো: ${generatedOtp}`
      };

      if (EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
          .then(() => handleOtpSentSuccess())
          .catch((err) => {
            console.error("EmailJS Error:", err);
            alert(`[ডেমো ব্যাকআপ OTP]: ${generatedOtp}`);
            handleOtpSentSuccess();
          });
      } else {
        setTimeout(() => {
          alert(`[EmailJS ডেমো মোড]: আপনার OTP কোড হলো: ${generatedOtp}`);
          handleOtpSentSuccess();
        }, 500);
      }
    }

    function handleOtpSentSuccess() {
      const btn = document.getElementById('btnSendOtp');
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-paper-plane text-xs"></i> ইমেইলে OTP পাঠান`;
      document.getElementById('otpStep1').classList.add('hidden');

    }

    function verifyOtpAndResetPassword() {
      const inputOtp = document.getElementById('fpInputOtp').value.trim();
      const newPassword = document.getElementById('fpNewPassword').value;

      if (inputOtp !== generatedOtp) {
        alert("ভুল OTP কোড! সঠিক কোড দিন।");

    async function toggleVoiceRecord() {
      if (!currentUser) return;
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopAndSendVoiceRecord();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          if (audioChunks.length === 0) return;
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const base64Audio = await fileToBase64(audioBlob);

          const newVoiceMsg = {
            id: Date.now(),
            roomKey: currentChatKey,
            listingId: activeChatListing.id,
            listingTitle: activeChatListing.title,
            senderPhone: currentUser.phone,
            senderName: currentUser.name,
            recipientPhone: activeChatRecipientPhone,
            type: 'voice',
            audioData: base64Audio,
            duration: formatSeconds(recordingSeconds),
            time: new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' })
          };

          chats.push(newVoiceMsg);
          localStorage.setItem('tolet_chats', JSON.stringify(chats));
          renderChatMessages();
          audioChunks = [];
        };

        mediaRecorder.start();
        recordingSeconds = 0;
        document.getElementById('recordingBanner').classList.remove('hidden');
        document.getElementById('recordingTimer').textContent = '00:00';
        recordingTimerInterval = setInterval(() => {
          recordingSeconds++;
          document.getElementById('recordingTimer').textContent = formatSeconds(recordingSeconds);
        }, 1000);

      } catch (err) {
        alert("মাইক্রোফোন চালু করার অনুমতি পাওয়া যায়নি!");
        console.error("Microphone error:", err);
      }
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function stopAndSendVoiceRecord() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        clearInterval(recordingTimerInterval);
        document.getElementById('recordingBanner').classList.add('hidden');
      }
    }

    function cancelVoiceRecord() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        audioChunks = [];
        mediaRecorder.stop();
        clearInterval(recordingTimerInterval);
        document.getElementById('recordingBanner').classList.add('hidden');
      }
    }

    function playCustomVoice(audioId, btn) {
      const audio = document.getElementById(audioId);
      const icon = btn.querySelector('i');
      const wave = document.getElementById(`wave_${audioId}`);

      if (audio.paused) {
        audio.play();
        icon.className = 'fa-solid fa-pause text-xs';
        if (wave) wave.classList.add('wave-playing');
      } else {
        audio.pause();
        icon.className = 'fa-solid fa-play text-xs ml-0.5';
        if (wave) wave.classList.remove('wave-playing');
      }
    }

    function onAudioEnded(audioId) {
      const audio = document.getElementById(audioId);
      const btn = audio.parentElement.querySelector('button');
      if (btn) btn.querySelector('i').className = 'fa-solid fa-play text-xs ml-0.5';
      const prog = document.getElementById(`prog_${audioId}`);
      if (prog) prog.style.width = '0%';
      const wave = document.getElementById(`wave_${audioId}`);
      if (wave) wave.classList.remove('wave-playing');
    }

    function updateAudioProgress(audioId) {
      const audio = document.getElementById(audioId);
      const prog = document.getElementById(`prog_${audioId}`);
      if (audio.duration && prog) {
        const pct = (audio.currentTime / audio.duration) * 100;
        prog.style.width = `${pct}%`;
      }
    }

          <div class="flex items-center gap-2 flex-shrink-0">

              <i class="fa-solid fa-pen"></i> এডিট
            </button>
            <button onclick="removeListing('${item.id}'); renderAdminAdsList();" class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-lg transition">
              <i class="fa-solid fa-trash"></i> ডিলিট
            </button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function openAdModalForCreate() {
      if (!currentUser) {
        alert("বিজ্ঞাপন দিতে হলে প্রথমে লগইন করুন।");
        toggleAuthModal(true);
        return;
      }
      document.getElementById('editListingId').value = '';
      document.getElementById('adModalTitle').textContent = 'নতুন বাসার বিজ্ঞাপন প্রকাশ করুন';
      document.getElementById('listingForm').reset();
      document.getElementById('formPhone').value = currentUser.phone || '';
      document.getElementById('imagePreviewContainer').innerHTML = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('videoUploadProgressWrapper').classList.add('hidden');
      
      document.querySelectorAll('.facility-chip').forEach(btn => {
        btn.classList.remove('bg-emerald-100', 'border-emerald-600', 'text-emerald-800');
        btn.classList.add('bg-white', 'text-slate-700');
      });

      refreshLocationDropdowns();
      toggleAdModal(true);
    }

    function openUserDashboard() {
      if (!currentUser) return;
      document.getElementById('dashUserPhone').textContent = `মোবাইল: ${currentUser.phone} | ইমেইল: ${currentUser.email || 'N/A'}`;
      
      const container = document.getElementById('userAdsListContainer');
      const myAds = listings.filter(item => item.ownerPhone === currentUser.phone);
      container.innerHTML = '';

      if (myAds.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10">
            <i class="fa-solid fa-clipboard-list text-3xl text-slate-300 mb-2 block"></i>
            <p class="text-sm text-slate-500">আপনি এখনো কোনো বিজ্ঞাপন দেননি।</p>
          </div>
        `;
      } else {
        myAds.forEach(item => {
          const adRow = document.createElement('div');
          adRow.className = "flex items-center justify-between p-3.5 bg-white rounded-xl border border-slate-200 shadow-sm gap-3";
          adRow.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden">
              <img src="${(item.images && item.images[0]) || 'https://via.placeholder.com/80'}" class="w-14 h-14 rounded-lg object-cover bg-slate-100 flex-shrink-0">
              <div class="truncate">
                <h4 class="font-bold text-slate-800 text-sm truncate">${item.title}</h4>
                <p class="text-xs text-slate-500">${item.area} • <span class="text-emerald-600 font-bold">৳${Number(item.rent).toLocaleString('bn-BD')}</span></p>
                <span class="text-[10px] text-slate-400">${item.available}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="editListing('${item.id}')" class="px-2.5 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold rounded-lg transition">
                <i class="fa-solid fa-pen-to-square"></i> <span class="hidden sm:inline">এডিট</span>
              </button>
              <button onclick="removeListing('${item.id}')" class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-lg transition">
                <i class="fa-solid fa-trash"></i> <span class="hidden sm:inline">ডিলিট</span>
              </button>
            </div>
          `;
          container.appendChild(adRow);
        });
      }

      toggleDashboardModal(true);
    }

    function editListing(id) {
      const item = listings.find(l => l.id == id);
      if (!item) return;

      document.getElementById('editListingId').value = item.id;
      document.getElementById('adModalTitle').textContent = 'বিজ্ঞাপন এডিট করুন';

      document.getElementById('formTitle').value = item.title;
      document.getElementById('formType').value = item.type;
      refreshLocationDropdowns();
      document.getElementById('formArea').value = item.area;
      document.getElementById('formRent').value = item.rent;
      document.getElementById('formAvailable').value = item.available;
      document.getElementById('formPhone').value = item.phone;
      document.getElementById('formSpecs').value = item.specs || '';
      document.getElementById('formDesc').value = item.desc || '';
      document.getElementById('formVideoUrl').value = (item.video && !item.video.startsWith('data:video')) ? item.video : '';

      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = '';
      if (item.images && item.images.length > 0) {
        container.classList.remove('hidden');
        item.images.forEach((imgSrc, i) => {
          const thumb = document.createElement('div');
          thumb.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 shadow-xs";
          thumb.innerHTML = `<img src="${imgSrc}" class="w-full h-full object-cover"><span class="absolute bottom-0 right-0 bg-black/60 text-white text-[9px] px-1 font-bold">#${i+1}</span>`;
          container.appendChild(thumb);
        });
      }

      toggleDashboardModal(false);
      toggleAdModal(true);
    }

    async function removeListing(id) {
      if (!confirm("আপনি কি নিশ্চিত এই বিজ্ঞাপনটি মুছে ফেলতে চান?")) return;

      if (isFirebaseReady && firebaseDb) {
        try {
          await firebaseDb.collection("listings").doc(String(id)).delete();
        } catch (err) {
          console.error("Firestore delete error:", err);
        }
      }

      listings = listings.filter(item => item.id != id);
      localStorage.setItem('gopalganj_tolet', JSON.stringify(listings));
      openUserDashboard();
      applyFilters();
    }

    function slideImage(id, step, total) {
      if (!cardImageIndexes[id]) cardImageIndexes[id] = 0;
      cardImageIndexes[id] = (cardImageIndexes[id] + step + total) % total;
      
      const imgEl = document.getElementById(`img-${id}`);
      const counterEl = document.getElementById(`count-${id}`);
      const item = listings.find(l => l.id == id);

      if (imgEl && item && item.images) {
        imgEl.src = item.images[cardImageIndexes[id]];
      }
      if (counterEl) {
        counterEl.textContent = `${cardImageIndexes[id] + 1}/${total}`;
      }
    }

    function playVideo(videoSrc) {
      const modal = document.getElementById('videoModal');
      const container = document.getElementById('videoContainer');
      
      if (videoSrc.startsWith('http') && !videoSrc.endsWith('.mp4') && !videoSrc.endsWith('.webm')) {
        window.open(videoSrc, '_blank');
        return;
      }

      container.innerHTML = `
        <video 
          controls 
          autoplay 
          controlsList="nodownload" 
          oncontextmenu="return false;" 
          class="w-full h-full max-h-[75vh] object-contain">
          <source src="${videoSrc}">
          আপনার ব্রাউজার ভিডিও সাপোর্ট করছে না।
        </video>
      `;
      modal.classList.remove('hidden');
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const container = document.getElementById('videoContainer');
      container.innerHTML = '';
      modal.classList.add('hidden');
    }

    function renderListings(items) {
      const container = document.getElementById('listingsContainer');
      const emptyState = document.getElementById('emptyState');
      const totalCount = document.getElementById('totalCount');

      container.innerHTML = '';
      totalCount.textContent = items.length;

      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      items.forEach(item => {
        const badgeColor = item.type === 'ফ্যামিলি' ? 'bg-blue-50 text-blue-700 border-blue-200' :
                           item.type === 'মেস সিট' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                           'bg-emerald-50 text-emerald-700 border-emerald-200';

        const imgs = item.images && item.images.length > 0 ? item.images : ["https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=600&auto=format&fit=crop&q=80"];
        cardImageIndexes[item.id] = 0;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="relative h-48 w-full bg-slate-900 overflow-hidden group">
              <img id="img-${item.id}" src="${imgs[0]}" alt="বাসার ছবি" class="w-full h-full object-cover">
              
              <div class="absolute top-3 left-3 z-10">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border bg-white/95 backdrop-blur shadow-sm ${badgeColor}">
                  ${item.type}
                </span>
              </div>

              ${imgs.length > 1 ? `
                <div class="absolute top-3 right-3 z-10 bg-black/60 text-white text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur">
                  <i class="fa-solid fa-camera mr-1"></i><span id="count-${item.id}">1/${imgs.length}</span>
                </div>
                <button onclick="slideImage('${item.id}', -1,${imgs.length})" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs opacity-80 group-hover:opacity-100 transition z-10">
                  <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button onclick="slideImage('${item.id}', 1,${imgs.length})" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs opacity-80 group-hover:opacity-100 transition z-10">
                  <i class="fa-solid fa-chevron-right"></i>
                </button>
              ` : ''}

              ${item.video ? `
                <button onclick="playVideo('${item.video}')" class="absolute bottom-3 right-3 bg-rose-600/90 hover:bg-rose-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg backdrop-blur flex items-center gap-1.5 shadow transition z-10">
                  <i class="fa-solid fa-play"></i> ভিডিও দেখুন
                </button>
              ` : ''}
            </div>

            <div class="p-5">
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                  <i class="fa-regular fa-clock mr-1"></i>${item.available}
                </span>
                <span class="text-xs text-emerald-700 font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-location-dot"></i> ${item.area}
                </span>
              </div>

              <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-1">${item.title}</h3>
              
              ${item.postedBy ? `<p class="text-[11px] text-slate-400 mb-2"><i class="fa-solid fa-user text-[10px] mr-1"></i> ${item.postedBy}</p>` : ''}

              ${item.specs ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg mb-2"><i class="fa-solid fa-layer-group text-slate-400 mr-1"></i> ${item.specs}</p>` : ''}
              
              <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-2">${item.desc || 'বিস্তারিত জানতে সরাসরি যোগাযোগ করুন।'}</p>
            </div>
          </div>

          <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
            <div>
              <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-bold">ভাড়া</span>
              <span class="text-base font-extrabold text-emerald-600">৳${Number(item.rent).toLocaleString('bn-BD')}</span>
              <span class="text-[11px] text-slate-500">/মাস</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="openChatForListing('${item.id}')" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-700 text-xs font-bold px-2.5 py-2 rounded-lg flex items-center gap-1 transition" title="মেসেজ বা ভয়েস চ্যাট করুন">
                <i class="fa-solid fa-comment-dots"></i> <span class="hidden sm:inline">চ্যাট</span>
              </button>
              
              <a href="https://wa.me/88${item.phone}" target="_blank" class="w-8 h-8 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-700 flex items-center justify-center text-sm transition" title="WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
              </a>
              <a href="tel:${item.phone}" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 transition shadow-sm">
                <i class="fa-solid fa-phone"></i> কল
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const area = document.getElementById('areaFilter').value;
      const type = document.getElementById('typeFilter').value;

      const filtered = listings.filter(item => {
        const titleMatch = (item.title || '').toLowerCase().includes(search);
        const descMatch = (item.desc || '').toLowerCase().includes(search);
        const areaMatch = (item.area || '').toLowerCase().includes(search);
        const matchesSearch = titleMatch || descMatch || areaMatch;

        const matchesArea = area === 'all' || item.area === area;
        const matchesType = type === 'all' || item.type === type;
        return matchesSearch && matchesArea && matchesType;
      });

      renderListings(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('areaFilter').value = 'all';
      document.getElementById('typeFilter').value = 'all';
      renderListings(listings);
    }

    // App Initialization
    refreshLocationDropdowns();
    updateAuthUI();
    listenToListings(); // Firestore থেকে রিয়েলটাইম ডেটা ফেচ
  </script>
